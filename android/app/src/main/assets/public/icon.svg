<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg-grad)" />
  
  <!-- Subtle inner border -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="#334155" stroke-width="4" opacity="0.3" />

  <!-- Abstract elegant geometric shape representing currency, accounting, and growth -->
  <g transform="translate(116, 116)" filter="url(#glow)">
    <!-- Growing Trend Line / Chart -->
    <path d="M 40 220 L 110 150 L 180 180 L 250 80 L 280 110" fill="none" stroke="url(#icon-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Arrowhead -->
    <path d="M 230 80 L 250 80 L 250 100" fill="none" stroke="url(#icon-grad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Dollar Sign & Hryvnia styling -->
    <circle cx="110" cy="150" r="16" fill="#10b981" />
    <circle cx="180" cy="180" r="16" fill="#6366f1" />
    <circle cx="250" cy="80" r="16" fill="#38bdf8" />
    
    <!-- Large Central Symbol representation of safe / coin -->
    <path d="M 80 80 A 60 60 0 1 1 200 200 A 60 60 0 1 1 80 80 Z" fill="none" stroke="url(#icon-grad)" stroke-width="12" stroke-dasharray="8,8" opacity="0.5" />
    
    <!-- Elegant center letter or symbol (UAH / currency emblem) -->
    <text x="140" y="160" font-family="system-ui, sans-serif" font-size="72" font-weight="900" fill="url(#icon-grad)" text-anchor="middle" dominant-baseline="middle">₴</text>
  </g>
</svg>
